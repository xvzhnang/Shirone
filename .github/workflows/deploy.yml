name: Deploy Shirone Blog

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-update] # 响应内容仓库发送的派发事件
  workflow_dispatch:

# 只保留最新一次部署，避免并发推送 gh-pages 冲突
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# 部署到 GitHub Pages 所需权限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Theme Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean content working copy
        run: rm -rf .content-src

      - name: Pull Private Content & Build
        env:
          # ✅ 修复：PAT 直接作为 userinfo，不要加 x-access-token: 前缀
          # x-access-token 是 GitHub App 安装令牌专用，PAT 使用会导致 401
          CONTENT_REPO_URL: "https://${{ secrets.CONTENT_ACCESS_TOKEN }}@github.com/xvzhnang/shirone-content.git"
          # 如果你有多个 ref（如分支名不同），可以显式指定：
          # CONTENT_REPO_REF: main
        run: |
          pnpm content:sync
          pnpm build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
